# .github/workflows/fuel-radar.yml
#
# Esegue ogni giorno alle 08:45 UTC (09:45 CET / 10:45 CEST)
# + manualmente dal tab "Actions" su GitHub
#
# Secret da configurare in Settings → Secrets → Actions:
#   TELEGRAM_TOKEN   → token del bot (da @BotFather)
#   TELEGRAM_CHAT_ID → il tuo chat ID numerico

name: Fuel Radar — MIMIT Daily

on:
  schedule:
    - cron: "45 8 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # elimina warning Node.js 20

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests pandas

      - name: Scarica e processa MIMIT
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOGLIA_DIESEL:    ${{ secrets.SOGLIA_DIESEL }}
        run: python scripts/process_mimit.py

      - name: Verifica output generato
        run: |
          echo "=== File in output/ ==="
          ls -lh output/
          echo "=== Anteprima JSON ==="
          head -c 500 output/fuel-data.json

      - name: Deploy JSON su GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
